name: Social drafts (manual upload packs)

on:
  schedule:
    # KST 11:00 → UTC 02:00
    - cron: "0 2 * * *"
    # KST 19:00 → UTC 10:00
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of packs to draft (1–4)"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  draft-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Draft places + export upload packs
        env:
          # Optional — captions fall back to local templates when unset
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Empty secret → scripts/social/placeUtils.js DEFAULT_SITE_URL
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then COUNT=2; fi
          # Clamp 1–4
          case "$COUNT" in
            ''|*[!0-9]*) COUNT=2 ;;
          esac
          if [ "$COUNT" -lt 1 ]; then COUNT=1; fi
          if [ "$COUNT" -gt 4 ]; then COUNT=4; fi

          SLOT=auto
          # Morning cron (UTC 02:00) → morning slot; evening cron → evening
          if [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            SLOT=morning
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            SLOT=evening
          fi

          echo "Drafting count=$COUNT slot=$SLOT (Meta tokens not required)"
          npm run social:draft -- --count="$COUNT" --slot="$SLOT"

      - name: Commit packs + queue if changed
        run: |
          if git diff --quiet -- src/data/social_queue.json social-exports \
            && [ -z "$(git ls-files --others --exclude-standard -- social-exports)" ]; then
            echo "No social pack/queue changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MSG="chore(social): draft manual upload packs"
          STAGE_DIRS="src/data/social_queue.json social-exports"

          # Snapshot generated artifacts before rebase retries
          TMPDIR_ART="$(mktemp -d)"
          cp src/data/social_queue.json "$TMPDIR_ART/social_queue.json"
          if [ -d social-exports ]; then
            cp -a social-exports "$TMPDIR_ART/social-exports"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            cp "$TMPDIR_ART/social_queue.json" src/data/social_queue.json
            if [ -d "$TMPDIR_ART/social-exports" ]; then
              rm -rf social-exports
              cp -a "$TMPDIR_ART/social-exports" social-exports
            fi

            git add $STAGE_DIRS
            if git diff --cached --quiet; then
              echo "Remote already has the same artifacts; nothing to push."
              exit 0
            fi
            git commit -m "$MSG"
            if git push origin HEAD:master; then
              echo "Pushed successfully (attempt ${attempt})"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying…"
            sleep $((attempt * 3))
          done
          echo "Failed to push pack updates after retries"
          exit 1
