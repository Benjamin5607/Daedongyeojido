name: Social post (Meta)

on:
  schedule:
    # KST 11:00 → UTC 02:00
    - cron: "0 2 * * *"
    # KST 19:00 → UTC 10:00
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Meta API (dry-run publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish approved social queue items
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run social:publish -- --dry-run
          else
            if [ -z "$META_PAGE_ACCESS_TOKEN" ] || [ -z "$META_IG_USER_ID" ] || [ -z "$META_PAGE_ID" ]; then
              echo "Meta secrets not configured — skipping publish."
              echo "Set META_PAGE_ACCESS_TOKEN, META_IG_USER_ID, META_PAGE_ID (and SITE_URL)."
              exit 0
            fi
            npm run social:publish
          fi

      - name: Commit queue updates if changed
        run: |
          if git diff --quiet -- src/data/social_queue.json; then
            echo "No social_queue.json changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MSG="chore(social): update publish queue"
          QUEUE_FILE="src/data/social_queue.json"
          cp "$QUEUE_FILE" /tmp/social_queue.generated.json

          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/social_queue.generated.json "$QUEUE_FILE"
            if git diff --quiet -- "$QUEUE_FILE"; then
              echo "Remote already has the same queue; nothing to push."
              exit 0
            fi
            git add "$QUEUE_FILE"
            git commit -m "$MSG"
            if git push origin HEAD:master; then
              echo "Pushed successfully (attempt ${attempt})"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying…"
            sleep $((attempt * 3))
          done
          echo "Failed to push queue updates after retries"
          exit 1
